name: release

# Push публикует уже проверенный снимок из репозитория; ежедневный запуск обновляет источники.
on:
  push:
    branches: [master]
    paths:
      - "dist/**"
      - "windows/**"
      - "macos/**"
      - ".github/release-header.md"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      refresh_prefixes:
        description: "Обновить BGP-префиксы перед сборкой (DNS + Team Cymru + RIPEstat)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ru-direct-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check collector regressions
        run: |
          python3 tools/privacy_scan.py
          python3 -m unittest discover -s tools -p test_collectors.py -v

      - name: Refresh BGP prefixes
        if: github.event_name == 'schedule' || inputs.refresh_prefixes
        run: python3 tools/refresh_prefixes.py --no-external

      # Amnezia не резолвит домены при импорте JSON: AmneziaWG и мобильные клиенты
      # берут маршруты только из полей ips/ip записи. Снапшот IP кладётся в сборку.
      - name: Resolve domain IPs
        if: github.event_name != 'push'
        run: python3 tools/resolve_domains.py --no-external

      - name: Build lists
        run: |
          python3 tools/catalog.py
          python3 tools/build_ru_direct.py --no-external
          python3 -m unittest discover -s tools -p test_collectors.py -v

      - name: Verify committed routing assets
        if: github.event_name == 'push'
        run: |
          # Push не должен незаметно заменить проверенные маршруты новым снимком DNS.
          git diff --exit-code -- dist/amnezia-ru-direct.json dist/amnezia-ru-direct-lite.json \
            dist/amnezia-ru-direct-ip.json dist/ru-direct-domains.txt dist/ru-direct-ipv4.txt \
            dist/wg-allowed-ips.txt dist/happ-ru-direct.json

      - name: Verify release manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          dist = pathlib.Path("dist")
          manifest = json.loads((dist / "manifest.json").read_text())
          assert manifest["selection_policy"] == "reviewed-catalog"
          assert manifest["external_domains"] == manifest["external_roots"] == 0
          assert manifest["routing"]["full"]["compacted"] <= 1000
          for name, digest in manifest["sha256"].items():
              assert hashlib.sha256((dist / name).read_bytes()).hexdigest() == digest, name
          PY

      - name: Detect changed routing assets
        id: changes
        run: |
          if git diff --quiet -- dist/amnezia-ru-direct.json dist/amnezia-ru-direct-lite.json \
            dist/amnezia-ru-direct-ip.json dist/ru-direct-domains.txt dist/ru-direct-ipv4.txt \
            dist/wg-allowed-ips.txt dist/happ-ru-direct.json; then
            echo "routes=false" >> "$GITHUB_OUTPUT"
          else
            echo "routes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/prefixes.json data/external.json data/external-report.md data/external-candidates.json data/domain-ips.json dist
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "RU Direct: обновление списков $(date -u +%Y-%m-%d)" \
              -- data/prefixes.json data/external.json data/external-report.md data/external-candidates.json data/domain-ips.json dist
            git push
          fi

      - name: Publish release
        if: steps.changes.outputs.routes == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ru-direct-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          DAY="$(date -u +%d.%m.%Y)"
          # Сверху — инструкция для обычного пользователя, ниже — техническая сводка сборки.
          sed "s/{{DATE}}/${DAY}/" .github/release-header.md > "${RUNNER_TEMP}/notes.md"
          cat dist/RELEASE_NOTES.md >> "${RUNNER_TEMP}/notes.md"
          # Установщик в один клик: постоянная ссылка releases/latest/download/install-windows.bat.
          cp windows/install.bat "${RUNNER_TEMP}/install-windows.bat"
          # Отключение автообновления в один клик: releases/latest/download/uninstall-windows.bat.
          cp windows/uninstall.bat "${RUNNER_TEMP}/uninstall-windows.bat"
          # macOS: .command отдаётся в ZIP — иначе браузер теряет бит +x и Finder
          # отказывается запускать файл по двойному клику.
          install -m 755 macos/install-macos.command "${RUNNER_TEMP}/install-macos.command"
          (cd "${RUNNER_TEMP}" && zip -qj install-macos.zip install-macos.command)
          gh release create "${TAG}" \
            --target "$(git rev-parse HEAD)" --latest \
            --title "Актуальный список российских сайтов для Amnezia VPN (${DAY})" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            dist/amnezia-ru-direct.json \
            dist/amnezia-ru-direct-lite.json \
            dist/amnezia-ru-direct-ip.json \
            dist/ru-direct-domains.txt \
            dist/ru-direct-ipv4.txt \
            dist/wg-allowed-ips.txt \
            dist/happ-ru-direct.json \
            dist/manifest.json \
            "${RUNNER_TEMP}/install-windows.bat" \
            "${RUNNER_TEMP}/uninstall-windows.bat" \
            "${RUNNER_TEMP}/install-macos.zip"
          # При push сохраняем предыдущий выпуск для отката. Ежедневный и ручной
          # запуск сохраняют прежнюю политику очистки истории Releases.
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            gh release list --limit 200 --json tagName --jq '.[].tagName' |
              while read -r old; do
                [ "${old}" = "${TAG}" ] || gh release delete "${old}" --cleanup-tag --yes
              done
          fi

      - name: Record coverage summary
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          manifest = json.loads(pathlib.Path("dist/manifest.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Domains: {manifest['domains']}; IPv4 routes: {manifest['cidrs']}; "
                            f"lite entries: {manifest['lite_entries']}\n\n")
              assert manifest['selection_policy'] == 'reviewed-catalog'
              assert manifest['external_domains'] == manifest['external_roots'] == 0
              summary.write(f"Policy: reviewed catalog only; "
                            f"effective routes: {manifest['routing']['full']['compacted']}\n")
          PY
