name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  catalog-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Static checks
        run: |
          python3 tools/privacy_scan.py
          python3 -m py_compile \
            macos/update_amnezia_routes.py \
            tools/catalog.py \
            tools/build_ru_direct.py \
            tools/refresh_prefixes.py \
            tools/import_external.py \
            tools/resolve_domains.py \
            tools/analyze_amnezia_log.py \
            tools/privacy_scan.py
          bash -n macos/install.sh macos/uninstall.sh macos/install-macos.command
          python3 -m json.tool config/asn-expand.json >/dev/null
          python3 -m json.tool config/external-sources.json >/dev/null
          python3 -m json.tool config/protected-ips.example.json >/dev/null
          python3 - <<'PY'
          import pathlib, sys
          missing = [
              str(path)
              for path in sorted(pathlib.Path("windows").glob("*.ps1"))
              if not path.read_bytes().startswith(b"\xef\xbb\xbf")
          ]
          if missing:
              print("нет UTF-8 BOM, Windows PowerShell 5.1 прочитает как ANSI: " + ", ".join(missing))
              sys.exit(1)
          PY
      - name: Validate catalog and rebuild lists
        run: |
          python3 -m unittest discover -s tools -p test_collectors.py -v
          python3 tools/catalog.py
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "tools")
          import catalog, refresh_prefixes
          external = refresh_prefixes.load_external(catalog.EXTERNAL_FILE)
          print(f"внешние списки: {len(external)} проверенных сетей")
          PY
          python3 tools/build_ru_direct.py --output-dir "${RUNNER_TEMP}/dist"
      - name: Committed dist must match the catalog
        run: |
          for name in amnezia-ru-direct.json amnezia-ru-direct-lite.json amnezia-ru-direct-ip.json wg-allowed-ips.txt \
                      ru-direct-domains.txt ru-direct-ipv4.txt happ-ru-direct.json; do
            diff -q "dist/${name}" "${RUNNER_TEMP}/dist/${name}" \
              || { echo "dist/${name} устарел — пересоберите tools/build_ru_direct.py"; exit 1; }
          done

  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse scripts and run the updater self-test
        shell: pwsh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:TEST_SHELL -NoProfile -NonInteractive -Command {
            foreach ($file in (Get-ChildItem windows/*.ps1)) {
              $errors = $null
              $tokens = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
              if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('amnezia-ru-direct.json', 'amnezia-ru-direct-lite.json', 'amnezia-ru-direct-ip.json')) {
            & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\windows\update-amnezia-routes.ps1 -SelfTest -Source ".\dist\$name"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($test in (Get-ChildItem windows/test-*.ps1 | Where-Object Name -ne 'test-app-vpn-guard.ps1' | Sort-Object Name)) {
            & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build the optional app guard and validate its configuration
        if: matrix.shell == 'powershell'
        shell: powershell
        run: .\windows\test-app-vpn-guard.ps1

  macos-helper:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify list replacement and rollback
        run: python3 -m unittest discover -s macos -p test_updater.py -v
      - name: Compile Swift helper and lint LaunchAgent
        run: |
          xcrun swiftc -warnings-as-errors -O macos/set-amnezia-routes.swift -o "${RUNNER_TEMP}/set-amnezia-routes"
          plutil -lint macos/io.github.amnezia-route-sync.plist.template
      - name: Parse the published list the way the updater does
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location(
              "updater", pathlib.Path("macos/update_amnezia_routes.py")
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          payload = pathlib.Path("dist/amnezia-ru-direct.json").read_bytes()
          domains, networks = module.parse_import_list(payload, "dist")
          collapsed = module.validate_and_collapse(networks)
          print(f"{len(domains)} доменов, {len(collapsed)} сетей")
          PY
